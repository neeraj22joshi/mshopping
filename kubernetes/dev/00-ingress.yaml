apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-mshopping-ingress
  namespace: dev-mshopping
  labels:
    env: dev-mshopping
    app: mshopping
    layer: frontend
spec:
  ingressClassName: nginx
  rules:
    - host: dev-mshopping.cloudcortex.in
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: dev-mshopping-service
                port:
                  number: 8080