apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: preprod-mshopping-ingress
  namespace: preprod-mshopping
  labels:
    env: preprod-mshopping
    app: mshopping
    layer: frontend
spec:
  ingressClassName: nginx
  rules:
    - host: preprod-mshopping.cloudcortex.in
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: preprod-mshopping-service
                port:
                  number: 8080